# Modified from Hy4ri/hermes-mobile for this fork; see NOTICE.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v1.2.3)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Gate: require a green Android CI/CD run on the exact tagged commit.
  #
  # This job used to re-run the whole validation matrix (ktlint, lint,
  # tests, both debug assemblies) that `android.yml` had already run on
  # the same commit minutes earlier. That cost ~7 minutes per release and
  # gave every release a second, independent chance to fail on runner
  # flake — which is exactly what happened on v0.4.4, where the duplicate
  # run failed in `packageHermesDebug` on a commit whose push workflow had
  # already produced both debug APKs.
  #
  # Verifying the recorded conclusion of the real CI run keeps the actual
  # guarantee (a tag may only be released from a commit that passed the
  # complete matrix, instrumented tests included) without paying for it or
  # re-rolling the dice. Only `push` and `workflow_dispatch` runs count: a
  # `pull_request` run validates a merge ref, not the commit itself.
  # ─────────────────────────────────────────────────────────────────────
  verify-ci:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tagged commit
        id: commit
        run: |
          set -eu
          COMMIT=$(git rev-parse HEAD)
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Releasing commit $COMMIT"

      - name: Require a successful Android CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # Android CI's slowest job (instrumented tests) has a 20-minute
          # timeout of its own, so allow a full matrix to finish before
          # declaring the tag unverifiable. The enclosing job timeout is
          # deliberately larger than this deadline so the explicit error
          # message below is what surfaces, not an opaque job cancellation.
          WORKFLOW=android.yml
          DEADLINE=$(( $(date +%s) + 1200 ))

          while :; do
            RUNS=$(
              gh api \
                "repos/$REPO/actions/workflows/$WORKFLOW/runs?head_sha=$COMMIT&per_page=100" \
                --jq '[.workflow_runs[]
                       | select(.event == "push" or .event == "workflow_dispatch")
                       | {status, conclusion, url: .html_url}]'
            )

            SUCCEEDED=$(
              printf '%s' "$RUNS" |
                jq -r '[.[]
                        | select(.status == "completed" and .conclusion == "success")]
                       | .[0].url // ""'
            )
            if [ -n "$SUCCEEDED" ]; then
              echo "Verified Android CI for $COMMIT: $SUCCEEDED"
              exit 0
            fi

            TOTAL=$(printf '%s' "$RUNS" | jq 'length')
            PENDING=$(
              printf '%s' "$RUNS" |
                jq '[.[] | select(.status != "completed")] | length'
            )

            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              echo "Android CI did not succeed for $COMMIT:" >&2
              printf '%s' "$RUNS" |
                jq -r '.[] | "  \(.conclusion // "unknown")  \(.url)"' >&2
              exit 1
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for an Android CI run on $COMMIT" >&2
              echo "Runs found: $TOTAL (still running: $PENDING)" >&2
              echo "A release tag must point at a commit that ran Android CI" >&2
              exit 1
            fi

            echo "Waiting for Android CI on $COMMIT (runs=$TOTAL running=$PENDING) …"
            sleep 20
          done

  build-release:
    name: Build signed Hermes Mobile APK
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod 0755 gradlew

      - name: Determine version
        id: version
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$DISPATCH_TAG
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          if ! printf '%s\n' "$TAG" |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi
          VERSION=${TAG#v}
          IFS=. read -r MAJOR MINOR PATCH <<EOF
          $VERSION
          EOF
          if [ "$MINOR" -gt 999 ] || [ "$PATCH" -gt 999 ]; then
            echo "Minor and patch versions must be at most 999" >&2
            exit 1
          fi
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if [ "$CODE" -le 0 ] || [ "$CODE" -gt 2147483647 ]; then
            echo "Calculated Android version code is out of range" >&2
            exit 1
          fi
          COMMIT=$(git rev-parse HEAD)
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "code=$CODE"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"
          echo "Release version=$VERSION code=$CODE commit=$COMMIT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" |
            base64 -d > "$RUNNER_TEMP/hermes-mobile-release.keystore"

      - name: Build signed Hermes release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hermes-mobile-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleHermesRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify and package APK
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          mkdir -p release
          APK=app/build/outputs/apk/hermes/release/app-hermes-release.apk
          OUT=release/hermes-mobile-$RELEASE_TAG.apk
          cp "$APK" "$OUT"
          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -maxdepth 2 -name apksigner -type f |
              sort |
              tail -n 1
          )
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "No executable apksigner found under build-tools" >&2
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" |
            tee release/apksigner-verification.txt

          EXPECTED_CERT=$(
            openssl x509 \
              -in signing/hermes-mobile-release-certificate.pem \
              -noout \
              -fingerprint \
              -sha256
          )
          EXPECTED_CERT=${EXPECTED_CERT#*=}
          EXPECTED_CERT=$(
            printf '%s' "$EXPECTED_CERT" |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )

          # Build Tools 36 prefixes the digest with "Signer #1" while 37
          # prefixes it with the signature scheme (for example, "V2 Signer").
          # Parse the stable suffix and collapse identical digests that may be
          # reported once per verified signature scheme.
          ACTUAL_CERTS=$(
            sed -n 's/^.*certificate SHA-256 digest: //p' \
              release/apksigner-verification.txt |
              tr '[:upper:]' '[:lower:]' |
              sort -u
          )
          ACTUAL_CERT_COUNT=$(
            printf '%s\n' "$ACTUAL_CERTS" |
              sed '/^$/d' |
              wc -l |
              tr -d ' '
          )
          ACTUAL_CERT=$(
            printf '%s\n' "$ACTUAL_CERTS" |
              sed -n '1p'
          )
          SIGNER_COUNT=$(
            sed -n 's/^Number of signers: //p' \
              release/apksigner-verification.txt |
              tail -n 1
          )

          if [ "$SIGNER_COUNT" != 1 ] ||
            [ "$ACTUAL_CERT_COUNT" != 1 ] ||
            [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "APK signing certificate does not match the pinned identity" >&2
            exit 1
          fi

          (
            cd release
            sha256sum "hermes-mobile-$RELEASE_TAG.apk" \
              > "hermes-mobile-$RELEASE_TAG.apk.sha256"
          )
          cp LICENSE NOTICE SIGNING.md release/
          cp signing/hermes-mobile-release-certificate.pem release/
          {
            echo "versionName=${{ steps.version.outputs.version }}"
            echo "versionCode=${{ steps.version.outputs.code }}"
            echo "commit=${{ steps.version.outputs.commit }}"
          } > release/provenance.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-mobile-release
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hermes-mobile-release.keystore"

  publish:
    name: Create draft GitHub release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hermes-mobile-release
          path: release

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.build-release.outputs.release_tag }}
          name: Hermes Mobile ${{ needs.build-release.outputs.release_tag }}
          generate_release_notes: true
          draft: true
          files: |
            release/hermes-mobile-${{ needs.build-release.outputs.release_tag }}.apk
            release/hermes-mobile-${{ needs.build-release.outputs.release_tag }}.apk.sha256
            release/apksigner-verification.txt
            release/provenance.txt
            release/LICENSE
            release/NOTICE
            release/SIGNING.md
            release/hermes-mobile-release-certificate.pem
