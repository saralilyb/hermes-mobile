# Modified from Hy4ri/hermes-mobile for this fork; see NOTICE.

name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: >-
    codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: >-
          actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 21
        uses: >-
          actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: >-
          gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Initialize CodeQL
        uses: >-
          github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile both debug flavors
        run: |
          ./gradlew \
            compileHermesDebugSources \
            compileIrisDebugSources \
            --no-daemon \
            --max-workers=1 \
            --no-build-cache

      - name: Perform CodeQL analysis
        uses: >-
          github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          category: /language:java-kotlin
